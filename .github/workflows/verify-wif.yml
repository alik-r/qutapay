on: workflow_dispatch
permissions: { contents: read, id-token: write }
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: qutapay-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - run: gcloud auth list && gcloud artifacts repositories list --location=europe-west1
